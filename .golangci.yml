# golangci-lint v2 configuration (CI pins the version in .github/workflows/ci.yml).
version: "2"
linters:
  # The standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  exclusions:
    # Unchecked errors of Close, Write to response writers and similar
    # (what golangci-lint v1 excluded by default).
    presets:
      - std-error-handling
    paths:
      # Frozen copy of golang.org/x/crypto/ssh v0.58.0 (see its README.md).
      - internal/legacyssh
formatters:
  enable:
    - gofmt
