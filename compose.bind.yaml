# ERS-Proxy with Docker Compose - data in a local directory.
#
# The directory must belong to UID 100 / GID 101 (the user inside the image).
# Before the first start:
#   mkdir -p data && sudo chown 100:101 data
#
# Usage:
#   docker compose -f compose.bind.yaml up -d  # start
#   docker compose -f compose.bind.yaml exec ers-proxy ers-proxy user create admin --role admin  # first admin
#   docker compose -f compose.bind.yaml logs -f ers-proxy  # logs
#   docker compose -f compose.bind.yaml pull && docker compose -f compose.bind.yaml up -d  # update
#   docker compose -f compose.bind.yaml exec ers-proxy ers-proxy backup  # consistent DB copy
#     (written to ./data/backups/; also keep ./data/secret.key)
#
# The container reaches your switches through the host's normal network routing.
# See docs/installation.md. To keep the data in a Docker volume instead, use
# compose.yaml.

services:
  ers-proxy:
    # Pin a version tag (for example 1.1.0) for production.
    image: ghcr.io/lan-dot-party/ers-proxy:latest
    restart: unless-stopped
    ports:
      # Loopback only, for a reverse proxy on the same host.
      # Use "9050:9050" to expose the port directly (no TLS).
      - "127.0.0.1:9050:9050"
    environment:
      # Exactly what the browser shows. Needed for secure cookies and the Origin check.
      ERSPROXY_PUBLIC_URL: https://ers.example.org
      TZ: Europe/Berlin
    volumes:
      - ./data:/var/lib/ers-proxy
      # Optional: your own configuration (replaces the built-in one).
      # - ./config.yaml:/etc/ers-proxy/config.yaml:ro
